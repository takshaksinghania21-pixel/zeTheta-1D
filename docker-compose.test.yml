# Ephemeral infrastructure for integration/e2e tests (CI or local Docker).
# Data lives in tmpfs; credentials are throwaway test values.
#   docker compose -f docker-compose.test.yml up -d --wait
#   TEST_DATABASE_URL=postgres://zetheta:test@localhost:55432/zetheta_test \
#   TEST_REDIS_URL=redis://:test@localhost:56379/6 \
#   TEST_KAFKA_BROKERS=localhost:59092 \
#   TEST_RABBITMQ_URL=amqp://zetheta:test@localhost:55672/zetheta npm run test:all
name: zetheta-notify-test

services:
  postgres:
    image: postgres:16.15-alpine
    environment: { POSTGRES_DB: zetheta_test, POSTGRES_USER: zetheta, POSTGRES_PASSWORD: test }
    ports: ['127.0.0.1:55432:5432']
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      {
        test: ['CMD-SHELL', 'pg_isready -U zetheta -d zetheta_test'],
        interval: 2s,
        timeout: 3s,
        retries: 30,
      }

  redis:
    image: redis:7.4.11-alpine
    command: ['redis-server', '--requirepass', 'test']
    ports: ['127.0.0.1:56379:6379']
    healthcheck:
      {
        test: ['CMD-SHELL', 'redis-cli -a test --no-auth-warning ping | grep PONG'],
        interval: 2s,
        timeout: 3s,
        retries: 30,
      }

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:59092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:59092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    ports: ['127.0.0.1:59092:59092']
    healthcheck:
      {
        test: ['CMD-SHELL', "bash -c '</dev/tcp/127.0.0.1/9092' || exit 1"],
        interval: 3s,
        timeout: 3s,
        retries: 40,
      }

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    environment:
      {
        RABBITMQ_DEFAULT_USER: zetheta,
        RABBITMQ_DEFAULT_PASS: test,
        RABBITMQ_DEFAULT_VHOST: zetheta,
      }
    ports: ['127.0.0.1:55672:5672']
    healthcheck:
      {
        test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity'],
        interval: 3s,
        timeout: 5s,
        retries: 40,
      }
