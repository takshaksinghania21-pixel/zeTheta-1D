  /api/v1/events:
    post:
      operationId: ingestEvent
      summary: Submit a financial event for asynchronous processing
      description: |-
        Validates the envelope and payload against the taxonomy, de-duplicates by (source, idempotencyKey) and publishes the event via the transactional outbox. Returns 202 for new events and 200 for exact duplicates; 409 if the key was used with a different payload.

        Also accepts the PDF Appendix A snake_case envelope (`event_type`, `event_id`, `source_system`, `timestamp`, `priority`, `user_id`, `payload`, `idempotency_key`); such requests are answered in the Appendix A shape, with `VALIDATION_FAILED` (422) errors. `notification_id` is the id of the notification request (one per event); per-channel notifications are listed at `status_url`.

        **Required permission:** events:ingest
      tags:
        - Events
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "#/components/schemas/EventEnvelope"
                - $ref: "#/components/schemas/PdfEventEnvelope"
      responses:
        "200":
          description: Duplicate of an earlier event
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/IngestResponse"
                  - $ref: "#/components/schemas/PdfIngestResponse"
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/IngestResponse"
                  - $ref: "#/components/schemas/PdfIngestResponse"
        "400":
          description: Malformed request or validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, invalid or expired credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated but not authorised
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Idempotency key reused with a different payload
        "422":
          description: Unknown event type or payload schema violation
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error (details are never exposed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
