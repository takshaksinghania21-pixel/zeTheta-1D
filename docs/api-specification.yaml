        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  minLength: 1
                  maxLength: 64
                events:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 255
                      providerMessageId:
                        type: string
                        minLength: 1
                        maxLength: 255
                      status:
                        type: string
                        enum:
                          - SENT
                          - DELIVERED
                          - READ
                          - FAILED
                          - BOUNCED
                      occurredAt:
                        type: string
                        format: date-time
                      errorCode:
                        type: string
                        maxLength: 64
                    required:
                      - id
                      - providerMessageId
                      - status
                    additionalProperties: false
                  minItems: 1
                  maxItems: 500
              required:
                - events
              additionalProperties: false
      responses:
        "200":
          description: Processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResult"
        "400":
          description: Malformed request or validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/invalid signature
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error (details are never exposed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
