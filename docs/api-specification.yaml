openapi: 3.0.3
info:
  title: Zetheta Notification Engine API
  version: 1.0.0
  description: Event-driven financial notification engine (BE-6B). All endpoints are versioned under /api/v1. Errors use the `Error` schema and carry the request correlation id (`X-Correlation-Id`).
servers:
  - url: http://localhost:3000
tags:
  - name: Auth
  - name: Events
  - name: Taxonomy
  - name: Notifications
  - name: Delivery
  - name: Users
  - name: Preferences
  - name: Consent
  - name: Compliance
  - name: Templates
  - name: Webhooks
  - name: DLQ
  - name: Operations
  - name: Analytics
  - name: Security
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
                required:
                  - message
            correlationId:
              type: string
          required:
            - code
            - message
      required:
        - error
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: number
        refreshToken:
          type: string
        refreshExpiresIn:
          type: number
      required:
        - accessToken
        - tokenType
        - expiresIn
    TokenRequest:
      oneOf:
        - type: object
          properties:
            grantType:
              type: string
              enum:
                - password
            username:
              type: string
              minLength: 1
              maxLength: 100
            password:
              type: string
              minLength: 1
              maxLength: 200
          required:
            - grantType
            - username
            - password
          additionalProperties: false
        - type: object
          properties:
            grantType:
              type: string
              enum:
                - client_credentials
            clientId:
              type: string
              minLength: 1
              maxLength: 100
            clientSecret:
              type: string
              minLength: 1
              maxLength: 200
          required:
            - grantType
            - clientId
            - clientSecret
          additionalProperties: false
        - type: object
          properties:
            grantType:
              type: string
              enum:
                - refresh_token
            refreshToken:
              type: string
              minLength: 10
              maxLength: 200
          required:
            - grantType
            - refreshToken
          additionalProperties: false
    EventDefinition:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        category:
          type: string
        priority:
          type: string
        regulatoryClass:
          type: string
        permittedChannels:
          type: array
          items:
            type: string
        defaultChannels:
          type: array
          items:
            type: string
        fallbackChannels:
          type: array
          items:
            type: string
        mandatoryChannels:
          type: array
          items:
            type: string
        latencyObjectiveMs:
          type: number
        quietHours:
          type: string
        frequencyCapExempt:
          type: boolean
        idempotencyKeyFields:
          type: array
          items:
            type: string
        retryPolicy:
          type: object
          properties:
            maxRetries:
              type: number
            baseDelayMs:
              type: number
            maxDelayMs:
              type: number
            jitterMaxMs:
              type: number
          required:
            - maxRetries
            - baseDelayMs
            - maxDelayMs
            - jitterMaxMs
        payload:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              nullable: true
      required:
        - code
        - name
        - category
        - priority
        - regulatoryClass
        - permittedChannels
        - defaultChannels
        - fallbackChannels
        - mandatoryChannels
        - latencyObjectiveMs
        - quietHours
        - frequencyCapExempt
        - idempotencyKeyFields
        - retryPolicy
        - payload
    IngestResponse:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - ACCEPTED
            - DUPLICATE
        idempotencyKey:
          type: string
        statusUrl:
          type: string
      required:
        - eventId
        - status
        - idempotencyKey
        - statusUrl
    PdfIngestResponse:
      type: object
      properties:
        notification_id:
          type: string
          format: uuid
        event_id:
          type: string
        status:
          type: string
          enum:
            - CREATED
            - DUPLICATE
        channels_targeted:
          type: array
          items:
            type: string
        estimated_delivery_ms:
          type: number
        created_at:
          type: string
        status_url:
          type: string
      required:
        - notification_id
        - event_id
        - status
        - channels_targeted
        - estimated_delivery_ms
        - created_at
        - status_url
    EventEnvelope:
      type: object
      properties:
        eventType:
          type: string
          pattern: ^[A-Z]{4}-\d{3}$
        userId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9:_|./-]+$
        payload:
          type: object
          additionalProperties:
            nullable: true
      required:
        - eventType
        - userId
        - occurredAt
        - payload
      additionalProperties: false
    PdfEventEnvelope:
      type: object
      properties:
        event_type:
          type: string
          pattern: ^[A-Z]{4}-\d{3}$
        event_id:
          type: string
          minLength: 1
          maxLength: 50
        source_system:
          type: string
          minLength: 1
          maxLength: 64
        timestamp:
          type: string
          format: date-time
        priority:
          type: integer
          minimum: 1
          maximum: 5
        user_id:
          type: string
          pattern: ^(usr_)?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        payload:
          type: object
          additionalProperties:
            nullable: true
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9:_|./-]+$
      required:
        - event_type
        - event_id
        - source_system
        - timestamp
        - user_id
        - payload
      additionalProperties: false
    BatchIngestResponse:
      type: object
      properties:
        batchId:
          type: string
          format: uuid
        accepted:
          type: number
        duplicates:
          type: number
        rejected:
          type: number
        results:
          type: array
          items:
            type: object
            properties:
              index:
                type: number
              status:
                type: string
                enum:
                  - ACCEPTED
                  - DUPLICATE
                  - REJECTED
              eventId:
                type: string
                format: uuid
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    nullable: true
                required:
                  - code
                  - message
            required:
              - index
              - status
      required:
        - batchId
        - accepted
        - duplicates
        - rejected
        - results
    Channel:
      type: string
      enum:
        - sms
        - email
        - push
        - whatsapp
        - inapp
    Priority:
      type: string
      enum:
        - CRITICAL
        - HIGH
        - MEDIUM
        - LOW
    NotificationState:
      type: string
      enum:
        - CREATED
        - ENRICHED
        - ROUTED
        - QUEUED
        - SENT
        - DELIVERED
        - READ
        - CAPPED
        - QUIET
        - DND
        - FAILED
        - RETRYING
        - DLQ
        - BOUNCED
        - SUPPRESSED
        - DIGESTED
    Locale:
      type: string
      enum:
        - en
        - hi
        - mr
        - ta
        - te
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          nullable: true
          format: uuid
        userId:
          type: string
          format: uuid
        eventType:
          type: string
        category:
          type: string
        channel:
          $ref: "#/components/schemas/Channel"
        priority:
          $ref: "#/components/schemas/Priority"
        state:
          $ref: "#/components/schemas/NotificationState"
        locale:
          $ref: "#/components/schemas/Locale"
        title:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        viaOverride:
          type: boolean
        isDigest:
          type: boolean
        parentNotificationId:
          type: string
          nullable: true
          format: uuid
        attemptCount:
          type: integer
        retryCount:
          type: integer
        provider:
          type: string
          nullable: true
        lastErrorCode:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        queuedAt:
          type: string
          nullable: true
          format: date-time
        sentAt:
          type: string
          nullable: true
          format: date-time
        deliveredAt:
          type: string
          nullable: true
          format: date-time
        readAt:
          type: string
          nullable: true
          format: date-time
        clickedAt:
          type: string
          nullable: true
          format: date-time
        nextAttemptAt:
          type: string
          nullable: true
          format: date-time
      required:
        - id
        - eventId
        - userId
        - eventType
        - category
        - channel
        - priority
        - state
        - locale
        - title
        - body
        - viaOverride
        - isDigest
        - parentNotificationId
        - attemptCount
        - retryCount
        - provider
        - lastErrorCode
        - createdAt
        - queuedAt
        - sentAt
        - deliveredAt
        - readAt
        - clickedAt
        - nextAttemptAt
    PolicyDecision:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          nullable: true
          format: uuid
        notificationId:
          type: string
          nullable: true
          format: uuid
        userId:
          type: string
          format: uuid
        channel:
          type: string
          nullable: true
        rule:
          type: string
        outcome:
          type: string
        explanation:
          type: string
        metadata:
          type: object
          additionalProperties:
            nullable: true
        correlationId:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - eventId
        - notificationId
        - userId
        - channel
        - rule
        - outcome
        - explanation
        - metadata
        - correlationId
        - createdAt
    EventStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
        category:
          type: string
        userId:
          type: string
          format: uuid
        source:
          type: string
        idempotencyKey:
          type: string
        status:
          type: string
        statusReason:
          type: string
          nullable: true
        occurredAt:
          type: string
        receivedAt:
          type: string
        processedAt:
          type: string
          nullable: true
        correlationId:
          type: string
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/PolicyDecision"
      required:
        - id
        - eventType
        - category
        - userId
        - source
        - idempotencyKey
        - status
        - statusReason
        - occurredAt
        - receivedAt
        - processedAt
        - correlationId
        - notifications
        - decisions
    NotificationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        nextCursor:
          type: string
          nullable: true
      required:
        - items
        - nextCursor
    NotificationDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          nullable: true
          format: uuid
        userId:
          type: string
          format: uuid
        eventType:
          type: string
        category:
          type: string
        channel:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 5
        state:
          $ref: "#/components/schemas/NotificationState"
        locale:
          $ref: "#/components/schemas/Locale"
        title:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        viaOverride:
          type: boolean
        isDigest:
          type: boolean
        parentNotificationId:
          type: string
          nullable: true
          format: uuid
        attemptCount:
          type: integer
        retryCount:
          type: integer
        provider:
          type: string
          nullable: true
        lastErrorCode:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        queuedAt:
          type: string
          nullable: true
          format: date-time
        sentAt:
          type: string
          nullable: true
          format: date-time
        deliveredAt:
          type: string
          nullable: true
          format: date-time
        readAt:
          type: string
          nullable: true
          format: date-time
        clickedAt:
          type: string
          nullable: true
          format: date-time
        nextAttemptAt:
          type: string
          nullable: true
          format: date-time
        priorityLabel:
          $ref: "#/components/schemas/Priority"
        notification_id:
          type: string
          format: uuid
        event_type:
          type: string
        user_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/NotificationState"
        template_id:
          type: string
          nullable: true
        external_id:
          type: string
          nullable: true
        delivery_attempts:
          type: integer
        rendered_content:
          type: object
          nullable: true
          additionalProperties:
            nullable: true
        state_history:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              timestamp:
                type: string
              actor:
                type: string
              metadata:
                type: object
                additionalProperties:
                  nullable: true
            required:
              - status
              - timestamp
              - actor
        compliance:
          type: object
          properties:
            dnd_checked:
              type: boolean
            dnd_check_timestamp:
              type: string
              nullable: true
            dnd_result:
              type: string
              nullable: true
            classification:
              type: string
            regulatory_override:
              type: boolean
            frequency_cap_checked:
              type: boolean
            frequency_cap_result:
              type: string
              nullable: true
          required:
            - dnd_checked
            - dnd_check_timestamp
            - dnd_result
            - classification
            - regulatory_override
            - frequency_cap_checked
            - frequency_cap_result
        cost_paisa:
          type: integer
        created_at:
          type: string
        delivered_at:
          type: string
          nullable: true
        latency_ms:
          type: number
          nullable: true
      required:
        - id
        - eventId
        - userId
        - eventType
        - category
        - channel
        - priority
        - state
        - locale
        - title
        - body
        - viaOverride
        - isDigest
        - parentNotificationId
        - attemptCount
        - retryCount
        - provider
        - lastErrorCode
        - createdAt
        - queuedAt
        - sentAt
        - deliveredAt
        - readAt
        - clickedAt
        - nextAttemptAt
        - priorityLabel
        - notification_id
        - event_type
        - user_id
        - status
        - template_id
        - external_id
        - delivery_attempts
        - rendered_content
        - state_history
        - compliance
        - cost_paisa
        - created_at
        - delivered_at
        - latency_ms
    Contact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
        masked:
          type: string
        verified:
          type: boolean
        status:
          type: string
      required:
        - id
        - channel
        - masked
        - verified
        - status
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalRef:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        segment:
          type: string
        locale:
          type: string
        timezone:
          type: string
        status:
          type: string
        createdAt:
          type: string
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
      required:
        - id
        - externalRef
        - displayName
        - segment
        - locale
        - timezone
        - status
        - createdAt
        - contacts
    Preferences:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        version:
          type: number
        explicit:
          type: object
          additionalProperties:
            nullable: true
        effective:
          type: object
          properties:
            channels:
              type: object
              additionalProperties:
                type: boolean
            categories:
              type: object
              additionalProperties:
                type: object
                properties:
                  enabled:
                    type: boolean
                  channels:
                    type: array
                    nullable: true
                    items:
                      type: string
                required:
                  - enabled
                  - channels
            digest:
              type: object
              properties:
                enabled:
                  type: boolean
                frequency:
                  type: string
                deliveryTime:
                  type: string
                categories:
                  type: array
                  items:
                    type: string
              required:
                - enabled
                - frequency
                - deliveryTime
                - categories
            quietHours:
              type: object
              properties:
                enabled:
                  type: boolean
                start:
                  type: string
                end:
                  type: string
              required:
                - enabled
                - start
                - end
            timezone:
              type: string
            locale:
              type: string
            sources:
              type: object
              additionalProperties:
                type: string
          required:
            - channels
            - categories
            - digest
            - quietHours
            - timezone
            - locale
            - sources
        digestSuggestion:
          type: object
          nullable: true
          properties:
            notificationsInWindow:
              type: number
            suggestedFrequency:
              type: string
            suggestedAt:
              type: string
          required:
            - notificationsInWindow
            - suggestedFrequency
            - suggestedAt
        hierarchy:
          type: array
          items:
            type: string
        user_id:
          type: string
        global_preferences:
          type: object
          properties:
            quiet_hours:
              type: object
              properties:
                start:
                  type: string
                end:
                  type: string
                timezone:
                  type: string
              required:
                - start
                - end
                - timezone
            language:
              type: string
            digest_mode:
              type: string
          required:
            - quiet_hours
            - language
            - digest_mode
        category_preferences:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              channels:
                type: object
                additionalProperties:
                  type: boolean
              digest_mode:
                type: string
            required:
              - category
              - channels
              - digest_mode
        regulatory_overrides:
          type: array
          items:
            type: object
            properties:
              event_type:
                type: string
              channels:
                type: array
                items:
                  type: string
              cannot_disable:
                type: boolean
            required:
              - event_type
              - channels
              - cannot_disable
        updated_at:
          type: string
      required:
        - userId
        - version
        - explicit
        - effective
        - digestSuggestion
        - hierarchy
        - user_id
        - global_preferences
        - category_preferences
        - regulatory_overrides
        - updated_at
    PdfPreferenceUpdate:
      type: object
      properties:
        category:
          type: string
          pattern: ^[A-Z]{4}$
        channels:
          type: object
          properties:
            sms:
              type: boolean
            email:
              type: boolean
            push:
              type: boolean
            whatsapp:
              type: boolean
            in_app:
              type: boolean
          additionalProperties: false
        digest_mode:
          type: string
          enum:
            - immediate
            - hourly
            - daily
      required:
        - category
        - channels
      additionalProperties: false
    ConsentRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
        purpose:
          type: string
        status:
          type: string
        source:
          type: string
        evidence:
          type: object
          additionalProperties:
            nullable: true
        recordedBy:
          type: string
        recordedAt:
          type: string
      required:
        - id
        - channel
        - purpose
        - status
        - source
        - evidence
        - recordedBy
        - recordedAt
    Template:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
        channel:
          type: string
        locale:
          type: string
        activeVersion:
          type: number
          nullable: true
        experimentVersion:
          type: number
          nullable: true
        experimentPercent:
          type: number
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - eventType
        - channel
        - locale
        - activeVersion
        - experimentVersion
        - experimentPercent
        - createdAt
        - updatedAt
    TemplateVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
        version:
          type: number
        subject:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        body:
          type: string
        checksum:
          type: string
        status:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
      required:
        - id
        - templateId
        - version
        - subject
        - title
        - body
        - checksum
        - status
        - createdBy
        - createdAt
    RenderedContent:
      type: object
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        locale:
          $ref: "#/components/schemas/Locale"
        requestedLocale:
          $ref: "#/components/schemas/Locale"
        templateVersion:
          type: number
        subject:
          type: string
        title:
          type: string
        body:
          type: string
        html:
          type: string
        sms:
          type: object
          properties:
            encoding:
              type: string
              enum:
                - GSM-7
                - UCS-2
            segments:
              type: number
            truncated:
              type: boolean
          required:
            - encoding
            - segments
            - truncated
        missingVariables:
          type: array
          items:
            type: string
      required:
        - channel
        - locale
        - requestedLocale
        - templateVersion
        - body
        - missingVariables
    WebhookResult:
      type: object
      properties:
        received:
          type: number
        applied:
          type: number
        duplicates:
          type: number
        unknown:
          type: number
        stale:
          type: number
      required:
        - received
        - applied
        - duplicates
        - unknown
        - stale
    DeadLetterEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
        notificationId:
          type: string
          nullable: true
          format: uuid
        eventId:
          type: string
          nullable: true
          format: uuid
        channel:
          type: string
          nullable: true
        reasonCode:
          type: string
        classification:
          type: string
          nullable: true
          enum:
            - TRANSIENT
            - PERMANENT
            - CONFIGURATION
        reasonMessage:
          type: string
        attempts:
          type: number
        retryHistory:
          type: array
          items:
            nullable: true
