      description: |-
        Header `X-Zetheta-Signature: t=<unix>,v1=<hex HMAC-SHA256(secret, "<t>.<rawBody>")>`; timestamps outside the tolerance window are rejected. Duplicate event ids are ignored.

        **Authentication:** provider webhook signature
      tags:
