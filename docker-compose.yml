# Local/full stack (services per PDF Appendix C). Requires a populated .env (see
# .env.example) providing at least:
#   POSTGRES_PASSWORD, REDIS_PASSWORD, RABBITMQ_PASSWORD,
#   JWT_SECRET, DATA_ENCRYPTION_KEY, DATA_HASH_KEY, WEBHOOK_SIGNING_SECRET
# and a PostgreSQL TLS certificate: scripts/dev-certs.sh (writes .local/certs/).
# Start:  docker compose up -d --build      Stop: docker compose down
# Host ports default to the standard ones; override with POSTGRES_HOST_PORT,
# REDIS_HOST_PORT, KAFKA_HOST_PORT, RABBITMQ_MGMT_HOST_PORT, APP_HOST_PORT.
# Extra values can come from a second env file, e.g.
#   docker compose --env-file .env --env-file .local/compose.env up -d --build --wait
# Validated on Docker Desktop 29.8 / Compose v5.5 (DEPLOYMENT.md "Verification status").
name: zetheta-notify

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  DATABASE_URL: postgres://zetheta:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/zetheta
  # PDF §A10.3: TLS to PostgreSQL, server verified against the mounted certificate.
  DATABASE_SSL: 'true'
  DATABASE_SSL_CA_FILE: /run/secrets/pg_server_crt
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  # Broker on the private network only (Appendix C PLAINTEXT listener); enable
  # SASL_SSL with KAFKA_SASL_* / KAFKA_SSL for any shared or production cluster.
  KAFKA_BROKERS: kafka:29092
  RABBITMQ_URL: amqp://zetheta:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672/zetheta
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY}
  DATA_HASH_KEY: ${DATA_HASH_KEY:?set DATA_HASH_KEY}
  WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:?set WEBHOOK_SIGNING_SECRET}
  PROVIDER_MODE: ${PROVIDER_MODE:-mock}
  MOCK_RECEIPT_CALLBACK_URL: http://app:3000/api/v1/webhooks/mock

x-app: &app
  build: { context: ., target: production }
  image: zetheta-notification-engine:local
  restart: unless-stopped
  read_only: true
  # Explicit modes: on container restart Docker remounts tmpfs as root:0755 otherwise,
  # which the non-root `node` user cannot write to.
  tmpfs: ['/tmp:mode=1777']
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  networks: [backend]
  secrets: [pg_server_crt]
  # Processes force-exit after 30 s of graceful shutdown; Docker's default 10 s would SIGKILL first.
  stop_grace_period: 35s
  # Workers serve health on METRICS_PORT (the image HEALTHCHECK probes the API port); `app` overrides this.
  healthcheck:
    test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9464/health/ready > /dev/null || exit 1']
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s
  depends_on:
    migrate: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zetheta
      POSTGRES_USER: zetheta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    # PostgreSQL refuses a key it does not own with 0600, so copy the secret first.
    # TLS is mandatory for TCP clients: hostssl only, hostnossl rejected (`ssl=on` alone
    # still accepts plaintext). Unix-socket access inside the container stays as the image default.
    command:
      - sh
      - -c
      - >-
        install -o postgres -g postgres -m 0600 /run/secrets/pg_server_key /tmp/server.key &&
        printf 'local all all trust\nhostssl all all all scram-sha-256\nhostnossl all all all reject\n'
        > /tmp/pg_hba.conf &&
        exec docker-entrypoint.sh postgres -c ssl=on
        -c ssl_cert_file=/run/secrets/pg_server_crt -c ssl_key_file=/tmp/server.key
        -c hba_file=/tmp/pg_hba.conf
    secrets: [pg_server_crt, pg_server_key]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    ports: ['127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zetheta -d zetheta']
      interval: 5s
      timeout: 5s
      retries: 20
    deploy: { resources: { limits: { cpus: '1.0', memory: 1g } } }

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?set REDIS_PASSWORD}',
        '--appendonly',
        'yes',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'noeviction',
        # PDF §A10.3: dangerous commands disabled (the application uses SCAN, never these).
        '--rename-command',
        'FLUSHALL',
        '',
        '--rename-command',
        'FLUSHDB',
        '',
        '--rename-command',
        'KEYS',
        '',
      ]
    volumes: [redisdata:/data]
    networks: [backend]
    ports: ['127.0.0.1:${REDIS_HOST_PORT:-6379}:6379']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    deploy: { resources: { limits: { cpus: '0.5', memory: 384m } } }

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    # Named volumes: ZooKeeper holds the cluster id and topic metadata; with the image's
    # anonymous volumes `docker compose down && up` gave Kafka a new, inconsistent cluster.
    volumes: [zkdata:/var/lib/zookeeper/data, zklog:/var/lib/zookeeper/log]
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 2181 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy: { resources: { limits: { cpus: '0.5', memory: 512m } } }

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    depends_on:
      zookeeper: { condition: service_healthy }
    ports: ['127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092']
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes: [kafkadata:/var/lib/kafka/data]
    networks: [backend]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1',
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy: { resources: { limits: { cpus: '1.0', memory: 1g } } }

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: zetheta
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: zetheta
    volumes: [rabbitdata:/var/lib/rabbitmq]
    networks: [backend]
    ports: ['127.0.0.1:${RABBITMQ_MGMT_HOST_PORT:-15672}:15672']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      timeout: 10s
      retries: 30
    deploy: { resources: { limits: { cpus: '0.5', memory: 512m } } }

  migrate:
    build: { context: ., target: production }
    image: zetheta-notification-engine:local
    # Seeding synthetic data is opt-in (SEED=true) and should never run in production.
    command:
      [
        'sh',
        '-c',
        'node dist/src/database/migrate.js latest && if [ "$$SEED" = true ]; then node dist/src/database/seeds/seed.js; fi',
      ]
    environment:
      <<: *app-env
      SEED: ${SEED:-false}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:-}
      SEED_SERVICE_SECRET: ${SEED_SERVICE_SECRET:-}
      SEED_DEMO_USER_PASSWORD: ${SEED_DEMO_USER_PASSWORD:-}
    networks: [backend]
    read_only: true
    tmpfs: ['/tmp:mode=1777', '/app/.local:uid=1000,gid=1000,mode=0700']
    secrets: [pg_server_crt]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  app:
    <<: *app
    environment: *app-env
    ports: ['127.0.0.1:${APP_HOST_PORT:-3000}:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health/ready > /dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy: { resources: { limits: { cpus: '1.0', memory: 512m } } }

  worker-events:
    <<: *app
    command:
      ['node', 'dist/src/workers/main.js', 'outbox-relay,event-consumer,scheduler,dlq-ingest']
    environment: *app-env
    depends_on:
      app: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: '1.0', memory: 512m } } }

  # CRITICAL events have their own topic, consumer group and process (PDF §C4.3).
  worker-critical:
    <<: *app
    command: ['node', 'dist/src/workers/main.js', 'critical-consumer,outbox-relay']
    environment: *app-env
    depends_on:
      app: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: '1.0', memory: 512m } } }

  worker-dispatch:
    <<: *app
    command: ['node', 'dist/src/workers/main.js', 'dispatcher,outbox-relay']
    environment: *app-env
    depends_on:
      app: { condition: service_healthy }
    deploy:
      replicas: 2
      resources: { limits: { cpus: '1.0', memory: 512m } }

  worker-analytics:
    <<: *app
    command: ['node', 'dist/src/workers/main.js', 'analytics']
    environment: *app-env
    depends_on:
      app: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: '0.5', memory: 384m } } }

networks:
  backend: {}

secrets:
  pg_server_crt: { file: ./.local/certs/pg-server.crt }
  pg_server_key: { file: ./.local/certs/pg-server.key }

volumes:
  pgdata: {}
  redisdata: {}
  zkdata: {}
  zklog: {}
  kafkadata: {}
  rabbitdata: {}
